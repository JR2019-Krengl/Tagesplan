<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Mein Tagesplan</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f5f0e8; font-family: 'Georgia', serif; min-height: 100vh; }

    .topbar {
      background: #1c1a17;
      padding: 1.25rem 1.25rem 0;
      position: sticky; top: 0; z-index: 10;
    }
    .topbar-inner { max-width: 520px; margin: 0 auto; }
    .topbar-label {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.65rem; letter-spacing: 0.18em;
      text-transform: uppercase; color: #9a8f72;
      margin-bottom: 0.25rem;
    }
    .tabs { display: flex; gap: 0.25rem; margin-top: 0.75rem; }
    .tab {
      flex: 1; padding: 0.6rem 0.5rem 0.7rem;
      border: none; border-radius: 8px 8px 0 0;
      cursor: pointer; display: flex;
      flex-direction: column; align-items: center; gap: 0.15rem;
      font-family: 'DM Sans', sans-serif; font-size: 0.8rem;
      transition: all 0.2s;
    }
    .tab.active { background: #f5f0e8; color: #1c1a17; font-weight: 500; }
    .tab.inactive { background: transparent; color: #6a6050; }
    .tab-sub { font-size: 0.65rem; opacity: 0.6; }

    .content { max-width: 520px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }

    .day-header { margin-bottom: 1.25rem; }
    .day-title-row { display: flex; align-items: baseline; gap: 0.75rem; flex-wrap: wrap; }
    .day-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.9rem; font-weight: 700; color: #1c1a17; line-height: 1;
    }
    .day-date { font-family: 'DM Sans', sans-serif; font-size: 0.75rem; color: #9a8f72; }
    .badge {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.65rem; color: #c8793a;
      background: #fdeede; padding: 0.15rem 0.5rem;
      border-radius: 20px; font-weight: 500; letter-spacing: 0.05em;
    }

    .progress-bar-wrap { margin-top: 1rem; }
    .progress-labels { display: flex; justify-content: space-between; margin-bottom: 0.35rem; }
    .progress-left { font-family: 'DM Sans', sans-serif; font-size: 0.72rem; color: #9a8f72; }
    .progress-right { font-family: 'DM Sans', sans-serif; font-size: 0.72rem; color: #5a7a5a; font-weight: 500; }
    .progress-track { background: #e0d8c8; border-radius: 4px; height: 5px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 4px; transition: width 0.4s ease; }

    .task-list {
      background: #fff; border-radius: 12px; overflow: hidden;
      box-shadow: 0 1px 8px rgba(0,0,0,0.06);
    }
    .task-row {
      display: flex; align-items: flex-start;
      gap: 0.75rem; padding: 0.85rem 0.9rem;
      transition: background 0.15s;
    }
    .task-row.done { background: #fafaf7; }
    .task-row.undone { background: #fff; }
    .task-divider { height: 1px; background: #f0ebe0; margin-left: 3.5rem; }

    .check-btn {
      margin-top: 0.15rem; width: 22px; height: 22px;
      border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .check-btn.done { border: none; background: #5a7a5a; }
    .check-btn.undone { border: 1.5px solid #c8b898; background: transparent; }
    .check-icon { color: #fff; font-size: 0.65rem; font-weight: bold; }

    .task-emoji { font-size: 1rem; flex-shrink: 0; margin-top: 0.1rem; }

    .task-content { flex: 1; min-width: 0; }
    .task-label {
      font-family: 'DM Sans', sans-serif; font-size: 0.9rem;
      font-weight: 400; line-height: 1.3;
    }
    .task-label.done { color: #aaa090; text-decoration: line-through; }
    .task-label.undone { color: #2a2820; }
    .task-time {
      font-family: 'DM Sans', sans-serif; font-size: 0.68rem;
      color: #b0a890; margin-top: 0.1rem; letter-spacing: 0.03em;
    }
    .task-note {
      margin-top: 0.35rem; font-size: 0.75rem; color: #8a7a60;
      font-family: 'DM Sans', sans-serif; font-style: italic;
      padding-left: 0.5rem; border-left: 2px solid #d8c8a8; line-height: 1.4;
    }

    .note-btn {
      background: none; border: none; font-size: 0.85rem;
      flex-shrink: 0; margin-top: 0.1rem; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .note-btn.has-note { opacity: 1; }
    .note-btn.no-note { opacity: 0.3; }

    .done-msg {
      margin-top: 1.5rem; text-align: center;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem; color: #5a7a5a;
    }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(28,26,23,0.6);
      display: flex; align-items: flex-end; justify-content: center;
      z-index: 100;
    }
    .modal-box {
      background: #fff; border-radius: 16px 16px 0 0;
      padding: 1.5rem; width: 100%; max-width: 520px;
    }
    .modal-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem; color: #1c1a17;
      margin-bottom: 0.75rem; font-weight: 600;
    }
    .modal-textarea {
      width: 100%; min-height: 90px;
      background: #f5f0e8; border: 1px solid #e0d8c8;
      border-radius: 8px; color: #2a2820; padding: 0.75rem;
      font-family: 'DM Sans', sans-serif; font-size: 0.9rem;
      resize: none; line-height: 1.5;
    }
    .modal-textarea:focus { outline: none; border-color: #a0704a; }
    .modal-buttons { display: flex; gap: 0.5rem; margin-top: 0.75rem; }
    .btn-delete {
      background: none; border: 1px solid #e8d8c8; color: #c07050;
      border-radius: 8px; padding: 0.5rem 0.75rem; cursor: pointer;
      font-family: 'DM Sans', sans-serif; font-size: 0.8rem;
    }
    .btn-cancel {
      flex: 1; background: #f0ebe0; border: none; color: #6a6050;
      border-radius: 8px; padding: 0.5rem; cursor: pointer;
      font-family: 'DM Sans', sans-serif; font-size: 0.85rem;
    }
    .btn-save {
      flex: 2; background: #1c1a17; border: none; color: #f5f0e8;
      border-radius: 8px; padding: 0.5rem; cursor: pointer;
      font-family: 'DM Sans', sans-serif; font-size: 0.85rem; font-weight: 500;
    }
  </style>
</head>
<body>

<div id="app"></div>

<script>
const DAYS = [
  {
    key: "donnerstag",
    label: "Donnerstag",
    date: "5. Juni 2026",
    badge: "Feiertag",
    tasks: [
      { id: "do1", emoji: "📄", label: "Review Artikel", time: null },
      { id: "do2", emoji: "💸", label: "Überweisungen", time: null },
      { id: "do3", emoji: "📅", label: "Terminplanung Kongresse Herbst", time: null },
      { id: "do4", emoji: "📧", label: "Emails", time: null },
      { id: "do5", emoji: "🏥", label: "Kontakt Radiologie MRT Studie", time: null },
    ],
  },
  {
    key: "freitag",
    label: "Freitag",
    date: "6. Juni 2026",
    badge: null,
    tasks: [
      { id: "fr1",  emoji: "🛏️", label: "Aufstehen", time: "05:30 – 06:10" },
      { id: "fr2",  emoji: "🚗", label: "Fahrt zur Arbeit", time: "06:10 – 06:20" },
      { id: "fr3",  emoji: "📋", label: "Aktenvisite / OP-Planung", time: "06:20 – 06:55" },
      { id: "fr4",  emoji: "🏥", label: "Visite", time: "07:00 – 07:40" },
      { id: "fr5",  emoji: "☕", label: "Frühbesprechung", time: "07:40 – 08:00" },
      { id: "fr6",  emoji: "🔪", label: "1. OP", time: "08:15 – 09:15" },
      { id: "fr7",  emoji: "📞", label: "Patientenanruf", time: "09:15 – 09:30" },
      { id: "fr8",  emoji: "🎗️", label: "Tumorkonferenz", time: "09:30 – 10:00" },
      { id: "fr9",  emoji: "🚗", label: "Fahrt nach Grieskirchen", time: "10:00 – 11:30" },
      { id: "fr10", emoji: "🔪", label: "OP Grieskirchen", time: "11:30 – 13:00" },
      { id: "fr11", emoji: "📋", label: "Visite + OP-Planung Montag + OP-Plan Kontrolle", time: "13:00 – 15:30" },
      { id: "fr12", emoji: "🗂️", label: "Allgemeine Organisation", time: "15:30 – 17:30" },
      { id: "fr13", emoji: "🚗", label: "Fahrt nach Hause", time: "17:30 – 18:00" },
    ],
  },
];

const STORAGE_KEY = "tagesplan_v1";

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : { checked: {}, notes: {}, activeDay: "donnerstag" };
  } catch { return { checked: {}, notes: {}, activeDay: "donnerstag" }; }
}

function saveState(s) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch {}
}

let state = loadState();
let editingId = null;
let noteInput = "";

function render() {
  saveState(state);
  const currentDay = DAYS.find(d => d.key === state.activeDay);

  const done = currentDay.tasks.filter(t => state.checked[t.id]).length;
  const total = currentDay.tasks.length;
  const progress = Math.round((done / total) * 100);
  const progressColor = progress === 100 ? "#5a7a5a" : "#a0704a";

  document.getElementById("app").innerHTML = `
    <div class="topbar">
      <div class="topbar-inner">
        <p class="topbar-label">Mein Tagesplan</p>
        <div class="tabs">
          ${DAYS.map(day => {
            const d = day.tasks.filter(t => state.checked[t.id]).length;
            const t = day.tasks.length;
            const isActive = day.key === state.activeDay;
            return `<button class="tab ${isActive ? 'active' : 'inactive'}" onclick="switchDay('${day.key}')">
              <span>${day.label}</span>
              <span class="tab-sub">${d}/${t}</span>
            </button>`;
          }).join('')}
        </div>
      </div>
    </div>

    <div class="content">
      <div class="day-header">
        <div class="day-title-row">
          <h1 class="day-title">${currentDay.label}</h1>
          <span class="day-date">${currentDay.date}</span>
          ${currentDay.badge ? `<span class="badge">${currentDay.badge}</span>` : ''}
        </div>
        <div class="progress-bar-wrap">
          <div class="progress-labels">
            <span class="progress-left">${done} von ${total} erledigt</span>
            <span class="progress-right">${progress}%</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" style="width:${progress}%; background:${progressColor};"></div>
          </div>
        </div>
      </div>

      <div class="task-list">
        ${currentDay.tasks.map((task, i) => {
          const isDone = !!state.checked[task.id];
          const hasNote = !!state.notes[task.id];
          return `
            <div class="task-row ${isDone ? 'done' : 'undone'}">
              <button class="check-btn ${isDone ? 'done' : 'undone'}" onclick="toggle('${task.id}')">
                ${isDone ? '<span class="check-icon">✓</span>' : ''}
              </button>
              <span class="task-emoji">${task.emoji}</span>
              <div class="task-content">
                <div class="task-label ${isDone ? 'done' : 'undone'}">${task.label}</div>
                ${task.time ? `<div class="task-time">${task.time}</div>` : ''}
                ${hasNote ? `<div class="task-note">${state.notes[task.id]}</div>` : ''}
              </div>
              <button class="note-btn ${hasNote ? 'has-note' : 'no-note'}" onclick="openNote('${task.id}')">
                ${hasNote ? '✏️' : '📝'}
              </button>
            </div>
            ${i < currentDay.tasks.length - 1 ? '<div class="task-divider"></div>' : ''}
          `;
        }).join('')}
      </div>

      ${done === total ? '<div class="done-msg">✦ Tag vollständig abgeschlossen ✦</div>' : ''}
    </div>

    ${editingId ? `
      <div class="modal-overlay" onclick="saveNote()">
        <div class="modal-box" onclick="event.stopPropagation()">
          <p class="modal-title">
            ${currentDay.tasks.find(t => t.id === editingId)?.emoji}
            ${currentDay.tasks.find(t => t.id === editingId)?.label}
          </p>
          <textarea class="modal-textarea" id="note-input" placeholder="Notiz eingeben..."
            oninput="noteInput=this.value">${noteInput}</textarea>
          <div class="modal-buttons">
            ${state.notes[editingId] ? `<button class="btn-delete" onclick="deleteNote()">Löschen</button>` : ''}
            <button class="btn-cancel" onclick="closeNote()">Abbrechen</button>
            <button class="btn-save" onclick="saveNote()">Speichern</button>
          </div>
        </div>
      </div>
    ` : ''}
  `;

  if (editingId) {
    const ta = document.getElementById("note-input");
    if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
  }
}

function switchDay(key) { state.activeDay = key; render(); }

function toggle(id) {
  state.checked[id] = !state.checked[id];
  render();
}

function openNote(id) {
  editingId = id;
  noteInput = state.notes[id] || "";
  render();
}

function saveNote() {
  if (editingId) {
    state.notes[editingId] = noteInput;
    editingId = null; noteInput = "";
    render();
  }
}

function deleteNote() {
  if (editingId) {
    delete state.notes[editingId];
    editingId = null; noteInput = "";
    render();
  }
}

function closeNote() { editingId = null; noteInput = ""; render(); }

render();
</script>
</body>
</html>
